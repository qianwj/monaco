[versions]
reactor-bom = "2025.0.6"
netty = "4.2.16.Final"
jackson = "2.18.2"
resilience4j = "2.3.0"
log4j = "2.24.3"
micrometer = "1.15.0"
junit-jupiter = "5.10.3"
rocksdb = "10.2.1"
grpc = "1.72.0"
protobuf = "4.31.1"
flatbuffers = "25.2.10"

# legacy (gateway/common only)
vertx = "5.1.5"

[libraries]
# Reactor
reactor-bom = { module = "io.projectreactor:reactor-bom", version.ref = "reactor-bom" }
reactor-core = { module = "io.projectreactor:reactor-core" }
reactor-netty-core = { module = "io.projectreactor.netty:reactor-netty-core" }
reactor-netty-http = { module = "io.projectreactor.netty:reactor-netty-http" }
reactor-test = { module = "io.projectreactor:reactor-test" }
netty-codec-mqtt = { module = "io.netty:netty-codec-mqtt", version.ref = "netty" }

# Storage
rocksdb = { module = "org.rocksdb:rocksdbjni", version.ref = "rocksdb" }

# Observability
micrometer-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }

# Serialization
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }

# gRPC
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }

# Logging
log4j-platform = { module = "org.apache.logging.log4j:log4j-bom", version.ref = "log4j" }
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

# Testing
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }

# Legacy (gateway/common only)
vertx-platform = { module = "io.vertx:vertx-stack-depchain", version.ref = "vertx" }
vertx-core = { module = "io.vertx:vertx-core", version.ref = "vertx" }
vertx-config = { module = "io.vertx:vertx-config", version.ref = "vertx" }
vertx-mqtt = { module = "io.vertx:vertx-mqtt", version.ref = "vertx" }
vertx-jdbc = { module = "io.vertx:vertx-jdbc-client", version.ref = "vertx" }
vertx-cluster = { module = "io.vertx:vertx-infinispan", version.ref = "vertx" }
vertx-metrics = { module = "io.vertx:vertx-micrometer-metrics", version.ref = "vertx" }
vertx-test = { module = "io.vertx:vertx-junit5", version.ref = "vertx" }
flatbuffers = { module = "com.google.flatbuffers:flatbuffers-java", version.ref = "flatbuffers" }
